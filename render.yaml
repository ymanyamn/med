services:
  - type: web
    name: med-civil-defense
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/centers
    envVars:
      - key: MED_CENTRAL_PASSWORD
        sync: false
      - key: MED_ADMIN_PASS
        sync: false
      - key: MED_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
